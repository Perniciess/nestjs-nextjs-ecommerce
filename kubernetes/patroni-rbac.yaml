apiVersion: v1
kind: ServiceAccount
metadata:
    name: patroni
    namespace: default
    labels:
        app: patroni

---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
    name: patroni
    namespace: default
    labels:
        app: patroni
rules:
    - apiGroups:
          - ""
      resources:
          - configmaps
      verbs:
          - create
          - delete
          - get
          - list
          - patch
          - update
          - watch
    - apiGroups:
          - ""
      resources:
          - endpoints
      verbs:
          - create
          - delete
          - get
          - list
          - patch
          - update
          - watch
    - apiGroups:
          - ""
      resources:
          - pods
      verbs:
          - get
          - list
          - patch
          - update
          - watch
    - apiGroups:
          - ""
      resources:
          - services
      verbs:
          - create

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
    name: patroni
    namespace: default
    labels:
        app: patroni
roleRef:
    apiGroup: rbac.authorization.k8s.io
    kind: Role
    name: patroni
subjects:
    - kind: ServiceAccount
      name: patroni
      namespace: default
