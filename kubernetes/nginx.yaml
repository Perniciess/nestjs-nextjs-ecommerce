apiVersion: apps/v1
kind: Deployment
metadata:
    name: nginx
    namespace: default
spec:
    replicas: 1
    selector:
        matchLabels:
            app: nginx
    template:
        metadata:
            labels:
                app: nginx
        spec:
            nodeSelector:
                role: master
            tolerations:
                - key: node-role.kubernetes.io/control-plane
                  operator: Exists
                  effect: NoSchedule
                - key: node-role.kubernetes.io/master
                  operator: Exists
                  effect: NoSchedule
            containers:
                - name: nginx
                  image: nginx:1.25-alpine
                  ports:
                      - containerPort: 80
                        hostPort: 80
                      - containerPort: 443
                        hostPort: 443
                  volumeMounts:
                      - name: nginx-conf
                        mountPath: /etc/nginx/conf.d
                      - name: nginx-ssl
                        mountPath: /etc/nginx/ssl
            volumes:
                - name: nginx-conf
                  hostPath:
                      path: /home/a1/e-commerce/nginx/conf
                      type: Directory
                - name: nginx-ssl
                  hostPath:
                      path: /home/a1/e-commerce/nginx/ssl
                      type: Directory

---
apiVersion: v1
kind: Service
metadata:
    name: nginx
    namespace: default
spec:
    selector:
        app: nginx
    ports:
        - name: http
          port: 80
          targetPort: 80
          nodePort: 30080
        - name: https
          port: 443
          targetPort: 443
          nodePort: 30443
    type: NodePort
