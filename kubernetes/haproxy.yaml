apiVersion: apps/v1
kind: Deployment
metadata:
    name: haproxy
    namespace: default
    labels:
        app: haproxy
spec:
    replicas: 2
    selector:
        matchLabels:
            app: haproxy
    template:
        metadata:
            labels:
                app: haproxy
        spec:
            affinity:
                podAntiAffinity:
                    preferredDuringSchedulingIgnoredDuringExecution:
                        - weight: 100
                          podAffinityTerm:
                              labelSelector:
                                  matchLabels:
                                      app: haproxy
                              topologyKey: kubernetes.io/hostname
                nodeAffinity:
                    requiredDuringSchedulingIgnoredDuringExecution:
                        nodeSelectorTerms:
                            - matchExpressions:
                                  - key: role
                                    operator: In
                                    values:
                                        - worker1
                                        - worker2
            containers:
                - name: haproxy
                  image: haproxy:2.9-alpine
                  imagePullPolicy: IfNotPresent
                  ports:
                      - containerPort: 5432
                        name: postgres
                        protocol: TCP
                      - containerPort: 5000
                        name: primary
                        protocol: TCP
                      - containerPort: 5001
                        name: replicas
                        protocol: TCP
                      - containerPort: 7000
                        name: stats
                        protocol: TCP
                  volumeMounts:
                      - name: config
                        mountPath: /usr/local/etc/haproxy
                        readOnly: true
                  livenessProbe:
                      httpGet:
                          path: /
                          port: 7000
                          scheme: HTTP
                      initialDelaySeconds: 30
                      periodSeconds: 10
                      timeoutSeconds: 5
                      failureThreshold: 3
                  readinessProbe:
                      httpGet:
                          path: /
                          port: 7000
                          scheme: HTTP
                      initialDelaySeconds: 10
                      periodSeconds: 10
                      timeoutSeconds: 5
                      failureThreshold: 3
                  resources:
                      requests:
                          memory: "64Mi"
                          cpu: "100m"
                      limits:
                          memory: "256Mi"
                          cpu: "500m"
            volumes:
                - name: config
                  configMap:
                      name: haproxy-config

---
apiVersion: v1
kind: Service
metadata:
    name: postgres
    namespace: default
    labels:
        app: haproxy
spec:
    type: ClusterIP
    ports:
        - port: 5432
          targetPort: 5432
          protocol: TCP
          name: postgres
    selector:
        app: haproxy

---
apiVersion: v1
kind: Service
metadata:
    name: postgres-primary
    namespace: default
    labels:
        app: haproxy
spec:
    type: ClusterIP
    ports:
        - port: 5432
          targetPort: 5000
          protocol: TCP
          name: primary
    selector:
        app: haproxy

---
apiVersion: v1
kind: Service
metadata:
    name: postgres-replicas
    namespace: default
    labels:
        app: haproxy
spec:
    type: ClusterIP
    ports:
        - port: 5432
          targetPort: 5001
          protocol: TCP
          name: replicas
    selector:
        app: haproxy

---
apiVersion: v1
kind: Service
metadata:
    name: haproxy-stats
    namespace: default
    labels:
        app: haproxy
spec:
    type: ClusterIP
    ports:
        - port: 7000
          targetPort: 7000
          protocol: TCP
          name: stats
    selector:
        app: haproxy
