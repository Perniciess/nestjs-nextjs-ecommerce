apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: e-commerce
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      nodeSelector:
        role: master
      containers:
        - name: frontend
          image: exzenzia/frontend:v4.6
          ports:
            - containerPort: 3001
          env:
            - name: NEXT_PUBLIC_API_BASE_URL
              value: "https://192.168.0.1/api"
            - name: NEST_WEB_URL
              value: "https://192.168.0.1"
            - name: PORT
              value: "3001"
