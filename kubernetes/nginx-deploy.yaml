apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx
  namespace: e-commerce
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nginx
  template:
    metadata:
      labels:
        app: nginx
    spec:
      nodeSelector:
        role: master
      containers:
        - name: nginx
          image: nginx:1.25-alpine
          ports:
            - containerPort: 80
              hostPort: 80
            - containerPort: 443
              hostPort: 443
          volumeMounts:
            - name: nginx-conf
              mountPath: /etc/nginx/conf.d
            - name: nginx-ssl
              mountPath: /etc/nginx/ssl
      volumes:
        - name: nginx-conf
          hostPath:
            path: /home/a1/e-commerce/nginx/conf
            type: Directory
        - name: nginx-ssl
          hostPath:
            path: /home/a1/e-commerce/nginx/ssl
            type: Directory
