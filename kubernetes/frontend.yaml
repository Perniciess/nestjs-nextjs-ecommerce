apiVersion: apps/v1
kind: Deployment
metadata:
    name: frontend
    namespace: default
spec:
    replicas: 1
    selector:
        matchLabels:
            app: frontend
    template:
        metadata:
            labels:
                app: frontend
        spec:
            nodeSelector:
                role: master
            tolerations:
                - key: node-role.kubernetes.io/control-plane
                  operator: Exists
                  effect: NoSchedule
                - key: node-role.kubernetes.io/master
                  operator: Exists
                  effect: NoSchedule
            containers:
                - name: frontend
                  image: exzenzia/frontend:v4.6
                  ports:
                      - containerPort: 3001
                  env:
                      - name: NEXT_PUBLIC_API_BASE_URL
                        value: "https://192.168.0.1/api"
                      - name: NEST_WEB_URL
                        value: "https://192.168.0.1"
                      - name: PORT
                        value: "3001"

---
apiVersion: v1
kind: Service
metadata:
    name: frontend
    namespace: default
spec:
    selector:
        app: frontend
    ports:
        - port: 3001
          targetPort: 3001
    type: ClusterIP
